# gnc-backend docker compose (development)
# Brings up: nginx -> gnc-backend -> postgres+TimescaleDB -> minio -> keycloak.
# v5.4 §1.6 mandates on-premises only; no public exposure.

services:

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - gnc-backend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [gnc]

  gnc-backend:
    build:
      context: ..
      dockerfile: gnc-backend/Dockerfile
    environment:
      - GNC_AUTH_DISABLED=0
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
      keycloak: { condition: service_started }
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../rockets:/app/rockets:ro
      - ../schemas:/app/schemas:ro
      - ../actuator_library.yaml:/app/actuator_library.yaml:ro
      - ../controller_library.yaml:/app/controller_library.yaml:ro
      - ../release_manifest.yaml:/app/release_manifest.yaml:ro
      - gnc_state:/app/var
    networks: [gnc]

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB:       gnc
      POSTGRES_USER:     gnc
      POSTGRES_PASSWORD: dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnc"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gnc]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gnc]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--http-port=8081"]
    environment:
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8081"
    networks: [gnc]

volumes:
  pg_data:
  minio_data:
  gnc_state:

networks:
  gnc:
    driver: bridge
